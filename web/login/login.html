<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Đăng nhập — Nông Trại Xanh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#16231A; --card:#F3EFE1; --card-text:#1D2A17; --card-sub:#5F6E56;
    --line:#3A4A34; --panel:#1E2E1A; --muted:#8A9280; --muted2:#C9D4BE;
    --leaf:#5C8A54; --sky:#4FA8D8; --sky-light:#7EC4EA; --danger:#C1502E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:#F3EFE1;
    font-family:'Be Vietnam Pro', sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .box{width:100%; max-width:380px;}
  .brand{text-align:center; margin-bottom:28px;}
  .brand p{color:var(--sky-light); font-size:14px; margin:0 0 4px;}
  .brand h1{font-family:'Fraunces', serif; font-size:28px; font-weight:600; margin:0; color:#F3EFE1;}
  .card{
    background:var(--card); color:var(--card-text); border-radius:16px;
    padding:32px 28px; border:1px solid rgba(79,168,216,0.25);
  }
  .field{margin-bottom:18px;}
  label{display:block; font-size:13px; color:var(--card-sub); margin-bottom:6px;}
  input[type=text], input[type=password]{
    width:100%; padding:11px 14px; border-radius:10px; border:1px solid #D8D3C1;
    background:#FFFEFA; color:var(--card-text); font-family:inherit; font-size:15px;
    outline:none; transition:border-color .2s;
  }
  input[type=text]:focus, input[type=password]:focus{ border-color:var(--sky); }
  .pw-wrap{position:relative;}
  .pw-wrap input{padding-right:42px;}
  .pw-toggle{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    border:none; background:transparent; color:var(--card-sub); cursor:pointer;
    padding:6px; display:flex; align-items:center; justify-content:center;
  }
  .pw-toggle:hover{ color:var(--card-text); }
  button.submit{
    width:100%; padding:12px; border:none; border-radius:10px; background:var(--leaf);
    color:#F3EFE1; font-family:inherit; font-size:15px; font-weight:500; cursor:pointer;
    transition:background .2s; margin-top:6px;
  }
  button.submit:hover{ background:#4E7845; }
  .error{
    display:none; background:#FBE7E2; color:#8A3319; font-size:13px;
    padding:9px 12px; border-radius:8px; margin-bottom:16px;
  }
  .foot{text-align:center; margin-top:20px; font-size:13px; color:var(--muted2);}
</style>
</head>
<body>
<div class="box">
  <div class="brand">
    <p>Trạm giám sát</p>
    <h1>Nông Trại Xanh</h1>
  </div>

  <div class="card">
    <p class="error" id="error-msg">Sai tên đăng nhập hoặc mật khẩu. Thử lại.</p>
    <form id="login-form">
      <div class="field">
        <label for="username">Tên đăng nhập</label>
        <input type="text" id="username" placeholder="ten.dangnhap" autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Mật khẩu</label>
        <div class="pw-wrap">
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
          <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Hiện mật khẩu">
            <svg id="eye-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit" class="submit">Đăng nhập</button>
    </form>
  </div>
</div>

<script>
  const pwInput = document.getElementById('password');
  const pwToggle = document.getElementById('pw-toggle');
  const eyeIcon = document.getElementById('eye-icon');
  const eyeOpen = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>';
  const eyeClosed = '<path d="M17.94 17.94A10.9 10.9 0 0 1 12 19c-7 0-11-7-11-7a18.5 18.5 0 0 1 4.22-5.19M9.9 4.24A9.1 9.1 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/>';

  pwToggle.addEventListener('click', function(){
    const showing = pwInput.type === 'text';
    pwInput.type = showing ? 'password' : 'text';
    eyeIcon.innerHTML = showing ? eyeOpen : eyeClosed;
    pwToggle.setAttribute('aria-label', showing ? 'Hiện mật khẩu' : 'Ẩn mật khẩu');
  });

  document.getElementById('login-form').addEventListener('submit', function(e){
    e.preventDefault();
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value.trim();
    const err = document.getElementById('error-msg');
    if(!u || !p){
      err.textContent = 'Nhập tên đăng nhập và mật khẩu.';
      err.style.display = 'block';
      return;
    }
    err.style.display = 'none';
    // Chỗ này nối vào API xác thực thực tế
    alert('Đăng nhập với: ' + u);
  });
</script>
</body>
</html>
